name: Portfolio checks

on:
  push:
    branches: [feature/portfolio-redesign]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save browser results and responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-review
          path: |
            test-results/
            playwright-report/
          retention-days: 14
